name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: 24.18.1
  NPM_VERSION: 12.0.2
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Use the repository npm version
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Verify pinned toolchain
        run: |
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"

      - name: Clean locked install
        run: npm ci --include=optional --strict-allow-scripts

      - name: Dependency and supply-chain gates
        run: |
          npm run audit
          npm run audit:production
          npm run audit:signatures
          npm run verify:dependency-graph
          npm run verify:native-lock
          npm run verify:platform-install

      - name: Application gates
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm run a11y
          git diff --check

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Use the repository npm version
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Install dependencies and Chromium
        run: |
          npm ci --include=optional --strict-allow-scripts
          npx playwright install --with-deps chromium

      - name: Browser workflow tests
        run: npm run test:e2e

  native-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Use the repository npm version
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Validate ARM64 install and build
        run: |
          npm ci --include=optional --strict-allow-scripts
          npm run verify:native-lock
          npm run typecheck
          npm test
          npm run build

  direct-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Use the repository npm version
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Build the direct production runtime
        run: |
          npm ci --include=optional --strict-allow-scripts
          npm run build

      - name: Exercise the production-only dependency surface
        run: |
          npm ci --omit=dev --include=optional --ignore-scripts
          npm run audit:production
          npm run smoke:backend-runtime
