name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: 24.18.1
  NPM_VERSION: 12.0.2
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Use the repository npm version
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Verify pinned toolchain
        run: |
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"

      - name: Clean locked install
        run: npm ci --include=optional --strict-allow-scripts

      - name: Dependency and supply-chain gates
        run: |
          npm run audit
          npm run audit:production
          npm run audit:signatures
          npm run verify:dependency-graph
          npm run verify:native-lock
          npm run verify:platform-install

      - name: Application gates
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm run a11y
          git diff --check

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Use the repository npm version
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Install dependencies and Chromium
        run: |
          npm ci --include=optional --strict-allow-scripts
          npx playwright install --with-deps chromium

      - name: Browser workflow tests
        run: npm run test:e2e

  native-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Use the repository npm version
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Validate ARM64 install and build
        run: |
          npm ci --include=optional --strict-allow-scripts
          npm run verify:native-lock
          npm run typecheck
          npm test
          npm run build

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1

      - name: Build pinned production image
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          docker build \
            --build-arg NP_RELEASE_VERSION="v${PACKAGE_VERSION}" \
            --build-arg SOURCE_REVISION=0000000000000000000000000000000000000000 \
            --build-arg SOURCE_DATE_EPOCH=0 \
            --tag np-service-request:test \
            .

      - name: Exercise read-only production image
        run: |
          test "$(docker run --rm --entrypoint id np-service-request:test -u)" != "0"
          if docker run --rm --entrypoint sh np-service-request:test -c 'command -v npm'; then
            echo "npm must not be present in the runtime image." >&2
            exit 1
          fi

          docker run --rm -d \
            --name np-service-request-test \
            --publish 127.0.0.1:8080:8080 \
            --env ANTI_BOT_SECRET=ci-container-antibot-secret-at-least-thirty-two-characters \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --tmpfs /app/data:rw,noexec,nosuid,size=32m,uid=1000,gid=1000 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            np-service-request:test
          trap 'docker stop np-service-request-test' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/api/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs np-service-request-test
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent --show-error http://127.0.0.1:8080/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/release.json |
            grep -Fq '"revision": "0000000000000000000000000000000000000000"'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/api/not-public)" = "404"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --header 'Origin: https://attacker.invalid' \
            --data '{"adminKey":"not-a-real-key"}' \
            http://127.0.0.1:8080/api/admin/session)" = "403"
          test -z "$(curl --silent --dump-header - --output /dev/null \
            --header 'Origin: https://attacker.invalid' \
            http://127.0.0.1:8080/api/board/bootstrap |
            tr -d '\r' |
            grep -i '^access-control-allow-origin:' || true)"
