name: Release production container

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: np-service-request-production-release
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm

      - name: Use the repository npm version
        run: npm install --global npm@12.0.2

      - name: Verify annotated release tag
        id: release
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "v${PACKAGE_VERSION}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${PACKAGE_VERSION}."
            exit 1
          fi
          if [[ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" != "tag" ]]; then
            echo "::error::Production release tags must be annotated."
            exit 1
          fi
          if [[ "$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{}")" != "$(git rev-parse HEAD)" ]]; then
            echo "::error::Release tag does not peel to the checked-out commit."
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse refs/remotes/origin/main)" ]]; then
            echo "::error::Release commit must be the exact origin/main revision."
            exit 1
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "source_date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
          echo "source_epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"

      - name: Clean install and release gates
        env:
          NP_RELEASE_VERSION: ${{ github.ref_name }}
          PUPPETEER_SKIP_DOWNLOAD: "true"
          SOURCE_DATE_EPOCH: ${{ steps.release.outputs.source_epoch }}
          SOURCE_REVISION: ${{ steps.release.outputs.revision }}
        run: |
          test "$(node --version)" = "v24.18.1"
          test "$(npm --version)" = "12.0.2"
          npm ci --include=optional --strict-allow-scripts
          npm run audit
          npm run audit:production
          npm run audit:signatures
          npm run verify:dependency-graph
          npm run verify:native-lock
          npm run verify:platform-install
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm run a11y
          git diff --check

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=sha,format=long,prefix=sha-
          labels: |
            org.opencontainers.image.created=${{ steps.release.outputs.source_date }}

      - name: Refuse to replace an existing release image
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SOURCE_REVISION: ${{ steps.release.outputs.revision }}
        run: |
          for reference in \
            "${IMAGE}:${RELEASE_VERSION}" \
            "${IMAGE}:sha-${SOURCE_REVISION}"; do
            inspect_error=""
            if inspect_error="$(docker buildx imagetools inspect "${reference}" 2>&1)"; then
              echo "::error::Immutable image tag already exists: ${reference}"
              exit 1
            fi
            if ! grep -Eiq 'not found|manifest unknown|name unknown|404' <<<"${inspect_error}"; then
              echo "::error::Could not safely establish that ${reference} is unused."
              printf '%s\n' "${inspect_error}" >&2
              exit 1
            fi
          done

      - name: Build and publish production image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            NP_RELEASE_VERSION=${{ github.ref_name }}
            SOURCE_REVISION=${{ steps.release.outputs.revision }}
            SOURCE_DATE_EPOCH=${{ steps.release.outputs.source_epoch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Record immutable deployment identity
        run: |
          {
            echo "### NP Service Request production image"
            echo
            echo "- Release: \`${GITHUB_REF_NAME}\`"
            echo "- Revision: \`${{ steps.release.outputs.revision }}\`"
            echo "- Digest: \`${{ steps.image.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
