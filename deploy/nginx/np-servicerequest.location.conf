# Drop-in public origin for the single-process NP Service Requests runtime.
#
# Include this file inside the HTTPS server block and replace any existing
# static `location /` or separate `/api` block. The Node process on loopback
# serves both the generated frontend and API and owns the generated hash-based
# Content-Security-Policy. Do not add or replace CSP/X-Frame-Options at the
# outer Nginx edge.

location / {
	client_max_body_size 100k;
	proxy_http_version 1.1;
	proxy_pass http://127.0.0.1:3006;
	proxy_connect_timeout 3s;
	proxy_send_timeout 15s;
	proxy_read_timeout 15s;
	proxy_next_upstream off;

	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header Connection "";
	proxy_hide_header Server;
}
